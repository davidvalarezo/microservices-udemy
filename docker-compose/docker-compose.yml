services:
  eureka-server:
    container_name: eureka-server
    image: eureka-server:latest
    ports:
      - "8761:8761"
    restart: always
    networks:
      - springcloud
  mysql8:
    container_name: mysql8
    image: mysql:8.0.40
    ports:
      - "3307:3306"
    restart: always
    networks:
      - springcloud
    environment:
      MYSQL_DATABASE: db_springboot_cloud
      MYSQL_ROOT_PASSWORD: admin123
  msvc-products:
    container_name: msvc-products
    image: msvc-products
    restart: always
    networks:
      - springcloud
    depends_on:
      - mysql8
      - eureka-server
  msvc-items:
    container_name: msvc-items
    image: msvc-items
    restart: always
    ports:
      - "8002:8002"
      - "8005:8005"
      - "8007:8007"
    networks:
      - springcloud
    depends_on:
      - eureka-server
      - msvc-products
networks:
  springcloud: